name: Publish the verified research artifact release

on:
  workflow_run:
    workflows:
      - Reproduce the full public research artifact
    types:
      - completed

permissions:
  contents: read

jobs:
  publish-verified-version:
    if: >-
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.head_branch == 'main' &&
      github.event.workflow_run.head_repository.full_name == github.repository
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - name: Publish the first validated software archive
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          VERIFIED_SHA: ${{ github.event.workflow_run.head_sha }}
          RELEASE_TAG: v1.0.0
        run: |
          set -euo pipefail
          current_sha="$(gh api "repos/${GITHUB_REPOSITORY}/git/ref/heads/main" --jq '.object.sha')"
          if [[ "$VERIFIED_SHA" != "$current_sha" ]]; then
            echo "A newer commit is on main. The completed run is retained as evidence."
            exit 0
          fi
          if gh release view "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "The versioned research archive already exists."
            exit 0
          fi
          gh release create "$RELEASE_TAG" \
            --repo "$GITHUB_REPOSITORY" \
            --target "$VERIFIED_SHA" \
            --title "Revocation Closure v1.0.0" \
            --notes "Versioned research software, court-order coding records, fixed synthetic inputs, and independent reproduction checks accompanying After the Clawback: Revocation Closure in Agentic Legal Workflows. The full public reproduction workflow passed for this commit. See REPRODUCING.md for commands and expected evidence."
          gh release view "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" --json url,tagName,targetCommitish
